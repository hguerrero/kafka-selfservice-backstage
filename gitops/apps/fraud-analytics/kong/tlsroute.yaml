---
# TLSRoute - fraud-analytics (worked example)
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: keg-tls-fraud-analytics
  namespace: kong
  labels:
    app.kubernetes.io/managed-by: backstage
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kong-keg
      namespace: kong
      sectionName: kafka-tls
  hostnames:
    - "*.fraud-analytics.127-0-0-1.sslip.io"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: keg-dp-kafka
          port: 9092
