---
# EventGatewayVirtualClusterPolicy (ACLs) - ${{ values.appName }}
# Grants the "${{ values.appName }}" principal READ access to exactly the requested
# topics plus its own consumer groups. Everything else is denied because the virtual
# cluster runs in enforce_on_gateway mode.
#
# THIS IS THE FILE YOU EDIT LATER. To grant more topics, re-run "Add Topics to
# Application" (or add entries under resourceNames.stat below) - nothing else about
# the application changes.
#
# CRD schema: rule fields are camelCase (`resourceType`, `resourceNames`);
# `operations` is a list of `{name: <op>}`; `resourceNames` is one object with a
# `type: stat` discriminator whose `stat` is a list of `{match: <glob>}`.
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayVirtualClusterPolicy
metadata:
  name: ${{ values.appName }}-acl
  namespace: kong
  labels:
    app.kubernetes.io/managed-by: backstage
    business-unit: ${{ values.businessUnit }}
spec:
  eventGatewayVirtualClusterRef:
    type: namespacedRef
    namespacedRef:
      name: ${{ values.appName }}
  apiSpec:
    type: acls
    acls:
      name: ${{ values.appName }}-acl
      description: Read access for ${{ values.appName }} to selected ${{ values.businessUnit }} topics.
      # Only the "${{ values.appName }}" principal is granted access.
      condition: "context.auth.principal.name == '${{ values.appName }}'"
      config:
        rules:
          - action: allow
            resourceType: topic
            operations:
              - name: describe
              - name: read
            resourceNames:
              type: stat
              stat:
              {%- for topic in values.topics %}
                - match: "${{ topic }}"
              {%- endfor %}
          - action: allow
            resourceType: group
            operations:
              - name: describe
              - name: read
            resourceNames:
              type: stat
              stat:
                # This app may only use consumer groups it prefixes with its own name.
                - match: "${{ values.appName }}.*"
