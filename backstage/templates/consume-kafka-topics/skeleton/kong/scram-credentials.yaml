{%- if values.authMode == "scram" %}
---
# SCRAM credentials for ${{ values.appName }}.
#
# The username is fixed to the application name; the password is a per-app secret.
# DO NOT commit a real password in plaintext. Choose one of:
#
#   1. SealedSecrets  - seal the value so it is safe to commit (recommended for GitOps).
#   2. External Secrets Operator - reference a value in Vault / a cloud secret store.
#   3. A custom Backstage scaffolder action that generates the password, writes it to
#      your secret store, and returns only a reference.
#
# The placeholder below lets the demo run end-to-end; replace REPLACE_ME before any
# real use. The client-side value must match (see the rendered client.properties).
apiVersion: v1
kind: Secret
metadata:
  name: ${{ values.appName }}-kafka-scram
  namespace: kong
  labels:
    app.kubernetes.io/managed-by: backstage
    business-unit: ${{ values.businessUnit }}
type: Opaque
stringData:
  username: "${{ values.appName }}"
  password: "REPLACE_ME"
{%- else %}
# No SCRAM secret required: this application authenticates with OAuth / OIDC.
# The gateway validates bearer tokens against the issuer configured in
# virtual-cluster.yaml. Nothing to store here.
{%- endif %}
