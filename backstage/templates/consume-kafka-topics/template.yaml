---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: consume-kafka-topics
  title: Consume Kafka Topics
  description: |
    Request self-service access to Northwind Financial Kafka topics through Kong
    Event Gateway. Provisions a dedicated virtual cluster for your application,
    issues credentials (SASL/PLAIN username + password, or OAuth), and creates ACLs
    scoped to exactly the topics you select. Changes are delivered as a GitOps pull
    request; on merge, Kong Operator reconciles the control plane, data plane and
    access rules.
  tags:
    - kafka
    - event-gateway
    - self-service
    - asyncapi
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Application
      required: [appName, owner]
      properties:
        appName:
          title: Application name
          type: string
          description: >
            Lowercase, kebab-case. Becomes the virtual cluster dnsLabel and the
            SNI hostname prefix (bootstrap.<appName>.127-0-0-1.sslip.io).
          pattern: "^[a-z][a-z0-9-]{2,40}[a-z0-9]$"
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          description: Team that owns this application.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group]
        description:
          title: Description
          type: string
          description: What this application does with the data.

    - title: Streams & access
      required: [businessUnit, authMode]
      properties:
        businessUnit:
          title: Stream provider
          type: string
          description: Which business unit's streams do you need?
          enum:
            - retail-banking-ny
            - wealth-management-la
          enumNames:
            - Retail Banking NY
            - Wealth Management LA
        authMode:
          title: Authentication
          type: string
          default: plain
          enum: [plain, oauth]
          enumNames:
            - SASL/PLAIN (username + password, terminated at the gateway)
            - OAuth / OIDC (bearer token via Kong Identity)
      dependencies:
        businessUnit:
          oneOf:
            - required: [topics]
              properties:
                businessUnit:
                  enum: [retail-banking-ny]
                topics:
                  title: Topics
                  type: array
                  minItems: 1
                  uniqueItems: true
                  ui:widget: checkboxes
                  items:
                    type: string
                    enum:
                      - payments.card-dispatch.v1
                      - markets.exchange-ticker.v1
                      - core.accounts.status.v2
            - required: [topics]
              properties:
                businessUnit:
                  enum: [wealth-management-la]
                topics:
                  title: Topics
                  type: array
                  minItems: 1
                  uniqueItems: true
                  ui:widget: checkboxes
                  items:
                    type: string
                    enum:
                      - advisor.daily-client-activity.v1
                      - clients.sentiment-signals.v1
                      - infosec.security.fraud.risk-scores.v3

    - title: GitOps delivery
      required: [repoUrl]
      properties:
        repoUrl:
          title: GitOps config repository
          type: string
          description: >
            The kafka-selfservice-gitops repo (Argo CD watches its apps/*). PRs from
            this template land there, not in the portal/platform repo.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: render
      name: Render Kong manifests
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: apps/${{ parameters.appName }}
        values:
          appName: ${{ parameters.appName }}
          owner: ${{ parameters.owner }}
          description: ${{ parameters.description }}
          businessUnit: ${{ parameters.businessUnit }}
          authMode: ${{ parameters.authMode }}
          topics: ${{ parameters.topics }}
          # Broker prefix per business unit (hidden from clients by the virtual cluster).
          namespacePrefix: ${{ parameters.businessUnit == "retail-banking-ny" and "RETAIL_NY." or "WEALTH_LA." }}
          apiRef: ${{ parameters.businessUnit }}-streams

    - id: publish
      name: Open GitOps pull request
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: onboard-${{ parameters.appName }}
        title: "Onboard ${{ parameters.appName }} to ${{ parameters.businessUnit }} streams"
        description: |
          Self-service Kafka access request via Backstage.

          - Application: `${{ parameters.appName }}`
          - Owner: `${{ parameters.owner }}`
          - Provider: `${{ parameters.businessUnit }}`
          - Auth: `${{ parameters.authMode }}`
          - Topics:
          ${{ parameters.topics }}

          Merging provisions a virtual cluster, credentials and ACLs via Kong Operator.

  # No catalog:register step: this is a PR-based GitOps flow, so the app's
  # catalog-info.yaml doesn't exist on the main branch until the PR is merged.
  # Registering here would fail (and `publish:github:pull-request` doesn't emit
  # repoContentsUrl anyway). The Component is picked up after merge - either by a
  # catalog discovery Location that scans the config repo's apps/*/catalog-info.yaml,
  # or by registering it once manually via Create -> Register Existing Component.

  output:
    links:
      - title: Open the GitOps pull request
        url: ${{ steps.publish.output.remoteUrl }}
    text:
      - title: Next steps
        content: |
          Your request is a **pull request** — nothing is live yet. Once it's merged,
          Argo CD applies it and Kong Operator provisions the virtual cluster, so give
          it a minute after merge before connecting.

          The durable copy of these details lives on your service's **Kafka Connection**
          card in the catalog once the app is registered.
      - title: Connection details (available after merge)
        content: |
          | Field | Value |
          |-------|-------|
          | Bootstrap server | `bootstrap.${{ parameters.appName }}.127-0-0-1.sslip.io:9092` |
          | Security protocol | `SASL_SSL` |
          {%- if parameters.authMode == "oauth" %}
          | Authentication | OAuth / OIDC (oauthBearer) — present a bearer token |
          {%- else %}
          | SASL mechanism | `PLAIN` |
          | Username | `${{ parameters.appName }}` |
          | Password | set to `REPLACE_ME` in the PR — replace before use |
          {%- endif %}
          | Topics | ${{ parameters.topics | join(", ") }} |
      - title: Connect with kafkactl (copy/paste)
        content: |
          Save as `kafkactl.yml`, then `export KAFKA_CTL_CONFIG=$PWD/kafkactl.yml`.
          {%- if parameters.authMode == "oauth" %}

          This app uses OAuth — set `sasl.mechanism: oauth` and supply a bearer token
          via your token provider (see the kafkactl OAuth docs); the block below shows
          the connection/TLS parts.

          ```yaml
          contexts:
            ${{ parameters.appName }}:
              brokers:
                - bootstrap.${{ parameters.appName }}.127-0-0-1.sslip.io:9092
              tls:
                enabled: true
                insecure: true          # self-signed demo cert; false with a trusted CA
              sasl:
                enabled: true
                mechanism: oauth
                # tokenProvider / token: <supply your OIDC bearer token>
          current-context: ${{ parameters.appName }}
          ```
          {%- else %}

          ```yaml
          contexts:
            ${{ parameters.appName }}:
              brokers:
                - bootstrap.${{ parameters.appName }}.127-0-0-1.sslip.io:9092
              tls:
                enabled: true
                insecure: true          # self-signed demo cert; false with a trusted CA
              sasl:
                enabled: true
                mechanism: plaintext    # kafkactl's name for SASL/PLAIN
                username: ${{ parameters.appName }}
                password: REPLACE_ME    # use the password set on your virtual cluster
          current-context: ${{ parameters.appName }}
          ```
          {%- endif %}

          Then test (logical topic names — the broker prefix is hidden):

          ```bash
          kafkactl --context ${{ parameters.appName }} get topics
          kafkactl --context ${{ parameters.appName }} consume ${{ parameters.topics[0] }}
          ```
      - title: Heads up on the password
        content: |
          The password is a placeholder in the generated manifest. Best practice is to
          treat credentials as show-once secrets: have the platform set a real value
          (ideally a generated one) and store it sealed — don't rely on the catalog to
          hold it long-term.
