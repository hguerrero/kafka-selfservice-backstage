---
# EventGatewayVirtualClusterPolicy (ACLs) - ${{ values.appName }}
# Regenerated by the "Add Topics to Application" template. This overwrites the
# existing ACL policy with the full topic set selected in Backstage - the virtual
# cluster, credentials and TLSRoute are not touched.
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayVirtualClusterPolicy
metadata:
  name: ${{ values.appName }}-acl
  namespace: kong
  labels:
    app.kubernetes.io/managed-by: backstage
    business-unit: ${{ values.businessUnit }}
spec:
  eventGatewayVirtualClusterRef:
    type: namespacedRef
    namespacedRef:
      name: ${{ values.appName }}
  apiSpec:
    type: acls
    acls:
      name: ${{ values.appName }}-acl
      description: Read access for ${{ values.appName }} to selected ${{ values.businessUnit }} topics.
      condition: "context.auth.principal.name == '${{ values.appName }}'"
      config:
        rules:
          - action: allow
            resource_type: topic
            operations:
              - name: describe
              - name: read
            resource_names:
            {%- for topic in values.topics %}
              - match: "${{ topic }}"
            {%- endfor %}
          - action: allow
            resource_type: group
            operations:
              - name: describe
              - name: read
            resource_names:
              - match: "${{ values.appName }}.*"
