# Kafka client config for the "fraud-analytics" application (SCRAM over TLS).
# Connects through Kong Event Gateway; the WEALTH_LA. prefix is hidden, so use the
# logical topic names. Access is limited by the ACL policy to:
#   clients.sentiment-signals.v1
#   infosec.security.fraud.risk-scores.v3

bootstrap.servers=bootstrap.fraud-analytics.127-0-0-1.sslip.io:9092

# SASL/SCRAM over TLS
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-256
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
  username="fraud-analytics" \
  password="REPLACE_ME";

# Trust the gateway's certificate. With a self-signed demo cert, either import
# examples/kafka-client/ca.crt into a truststore, or (demo only) skip host check:
ssl.truststore.location=/path/to/truststore.jks
ssl.truststore.password=changeit
# ssl.endpoint.identification.algorithm=

group.id=fraud-analytics.consumer
auto.offset.reset=earliest
