---
# GatewayConfiguration
# Tells Kong Operator how to provision the Kong Gateway data plane that fronts the
# Event Gateway. References the same Konnect auth secret used everywhere else.
apiVersion: gateway-operator.konghq.com/v2beta1
kind: GatewayConfiguration
metadata:
  name: kong-configuration
  namespace: kong
spec:
  konnect:
    authRef:
      name: konnect-api-auth
  dataPlaneOptions:
    deployment:
      podTemplateSpec:
        spec:
          containers:
            - name: proxy
              image: kong/kong-gateway:3.14
---
# GatewayClass - provisioned by Kong Operator (not the Ingress Controller).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kong
spec:
  controllerName: konghq.com/gateway-operator
  parametersRef:
    group: gateway-operator.konghq.com
    kind: GatewayConfiguration
    name: kong-configuration
    namespace: kong
---
# Gateway - public entrypoint for Kafka clients on port 9092 with TLS passthrough,
# so the Event Gateway data plane terminates TLS and routes by SNI.
#
# The wildcard "*.127-0-0-1.sslip.io" covers every virtual cluster bootstrap/broker
# host for a local minikube demo (run `minikube tunnel`). For a real cluster,
# replace with your LoadBalancer IP, e.g. "*.192-168-49-2.sslip.io".
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kong-keg
  namespace: kong
spec:
  gatewayClassName: kong
  listeners:
    - name: kafka-tls
      protocol: TLS
      port: 9092
      hostname: "*.127-0-0-1.sslip.io"
      tls:
        mode: Passthrough
        certificateRefs: []
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: TLSRoute
    # HTTPS listener for web UIs (Backstage, Argo CD) on the same Kong data plane.
    # TLS is TERMINATED here using the wildcard keg-tls-secret (*.127-0-0-1.sslip.io,
    # which covers backstage.* and argocd.*). HTTPS is REQUIRED, not cosmetic:
    # browsers only expose the Web Crypto API (crypto.randomUUID / subtle) in a secure
    # context, and Backstage crashes without it when served over plain http on a
    # non-localhost host.
    #
    # No hostname is set on purpose: giving it the same "*.127-0-0-1.sslip.io" wildcard
    # as the kafka-tls listener triggers a Kong listener HostnameConflict (identical
    # hostname string across listeners). With the hostname omitted the cert's SNI still
    # matches, and each HTTPRoute restricts to its own host. `from: All` lets HTTPRoutes
    # in other namespaces (backstage, argocd) attach cross-namespace.
    - name: web
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: keg-tls-secret
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
