---
# Northwind Financial - Kafka topics (the "products" offered through self-service).
# Topics carry a business-unit prefix on the broker; each virtual cluster hides the
# prefix so consuming apps use the logical name only. Example:
#   broker: RETAIL_NY.payments.card-dispatch.v1
#   client: payments.card-dispatch.v1
#
# Each logical topic here is published to Backstage as an AsyncAPI API entity
# (see catalog/). App developers browse these and request access via the template.

# --- Retail Banking NY ------------------------------------------------------
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: retail-ny-payments-card-dispatch-v1
  namespace: kafka
  labels:
    strimzi.io/cluster: northwind
    business-unit: retail-banking-ny
spec:
  topicName: RETAIL_NY.payments.card-dispatch.v1
  partitions: 3
  replicas: 3
  config:
    retention.ms: "86400000"
    cleanup.policy: delete
    compression.type: lz4
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
