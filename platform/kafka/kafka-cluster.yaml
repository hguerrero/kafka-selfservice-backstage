---
# KafkaNodePool - northwind
# Three-node combined controller+broker pool (KRaft). Ephemeral storage is fine for
# a demo; switch to persistent for anything real.
# Install Strimzi first:
#   kubectl create -f 'https://strimzi.io/install/latest?namespace=kafka' -n kafka
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: kafka
  labels:
    strimzi.io/cluster: northwind
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: ephemeral
        kraftMetadata: shared
  resources:
    requests:
      memory: 768Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 400m
  jvmOptions:
    "-Xmx": "384m"
    "-Xms": "384m"
---
# Kafka cluster - northwind
# Internal plaintext listener on 9092. The Event Gateway data plane is the only
# client; end users never reach Kafka directly.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: northwind
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
