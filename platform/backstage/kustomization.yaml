---
# In-cluster Backstage. Apply after building and pushing your Backstage image and
# setting the values in backstage-secrets.yaml.
#   kubectl apply -k platform/backstage/
# httproute.yaml exposes Backstage through the shared Kong Gateway; it needs the
# "web" listener from platform/networking/gateway.yaml, so apply the platform first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backstage
resources:
  - 00-namespace.yaml
  - backstage-secrets.yaml
  - app-config.configmap.yaml
  - postgres.yaml
  - deployment.yaml
  - httproute.yaml
