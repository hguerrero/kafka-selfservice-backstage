---
# Secrets for the in-cluster Backstage. DO NOT commit real values - this is a stub
# so the demo applies cleanly. Use SealedSecrets / External Secrets for real use.
#   GITHUB_TOKEN  - PAT/App token with repo + PR scope (templates open pull requests)
#   BACKEND_SECRET - random string for Backstage backend auth (openssl rand -base64 32)
apiVersion: v1
kind: Secret
metadata:
  name: backstage-secrets
  namespace: backstage
type: Opaque
stringData:
  POSTGRES_USER: "backstage"
  POSTGRES_PASSWORD: "REPLACE_ME"
  GITHUB_TOKEN: "REPLACE_ME"
  BACKEND_SECRET: "REPLACE_ME"
