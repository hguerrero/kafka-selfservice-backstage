---
# Production app-config for the in-cluster Backstage, mounted at
# /app/app-config.production.yaml and layered on top of the image's app-config.yaml.
# Secrets are injected as env vars from backstage-secrets (see deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-app-config
  namespace: backstage
data:
  app-config.production.yaml: |
    app:
      # HTTPS through the Kong Gateway "web" listener (TLS terminated there). HTTPS is
      # required: Backstage uses the Web Crypto API, which browsers only expose in a
      # secure context (https, or localhost). Plain http on this host -> app crash.
      # Alternative for a quick local run without TLS: port-forward and set both URLs to
      # http://localhost:7007 (localhost counts as a secure context).
      baseUrl: https://backstage.127-0-0-1.sslip.io
    backend:
      baseUrl: https://backstage.127-0-0-1.sslip.io
      listen:
        host: 0.0.0.0
        port: 7007
      auth:
        keys:
          - secret: ${BACKEND_SECRET}
      cors:
        origin: https://backstage.127-0-0-1.sslip.io
      database:
        client: pg
        connection:
          host: backstage-postgres.backstage.svc.cluster.local
          port: 5432
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}

    # The scaffolded app uses guest sign-in, which is normally DEV-ONLY. The image runs
    # with NODE_ENV=production, so guest must be explicitly allowed or the app renders
    # a blank shell (loads index.html/title, then fails to get an identity). For a demo
    # this is fine; for real use, replace guest with a proper auth provider + resolver.
    # Your frontend must also render a guest SignInPage, e.g. in packages/app/src/App.tsx:
    #   components: { SignInPage: props => <SignInPage {...props} auto providers={['guest']} /> }
    auth:
      environment: production
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true

    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}

    catalog:
      rules:
        - allow: [Component, System, API, Domain, Group, User, Location, Template]
      locations:
        - type: url
          target: https://github.com/hguerrero/kafka-selfservice-backstage/blob/main/catalog-info.yaml
          rules:
            - allow: [API, System, Domain, Group, User, Location, Template]

      # The self-service templates open PRs to the config repo; on merge, each app's
      # apps/<app>/catalog-info.yaml should be discovered here. GitHub discovery scans
      # the config repo for those files. Requires the GitHub catalog module in your
      # backend image:
      #   yarn --cwd packages/backend add @backstage/plugin-catalog-backend-module-github
      # then it's auto-registered via the new backend system. Uncomment to enable:
      providers:
        github:
          kafkaTenants:
            organization: <your-org>
            catalogPath: /apps/*/catalog-info.yaml
            filters:
              repository: kafka-selfservice-gitops
              branch: main
            schedule:
              frequency: { minutes: 2 }
              timeout: { minutes: 1 }
      
      # No discovery? After a PR merges, register the app once via the UI:
      # Create -> Register Existing Component -> paste the app's catalog-info.yaml URL.
